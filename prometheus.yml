# ==============================================================================
# CloudPulse - Prometheus Server Configuration
# ==============================================================================

global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    monitor: 'cloudpulse-production-monitor'
    environment: 'production'

rule_files:
  - 'alert.rules.yml'

scrape_configs:
  # 1. Scrape CloudPulse Web Application & REST API
  - job_name: 'cloudpulse-app'
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets: ['app:3000', 'host.docker.internal:3000']
        labels:
          tier: 'application'
          service: 'cloudpulse-saas'

  # 2. Scrape Prometheus Self-Telemetry
  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']
        labels:
          tier: 'observability'
