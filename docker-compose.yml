# ==============================================================================
# CloudPulse - Multi-Container Orchestration Architecture
# Services: App (Node.js) + Database (PostgreSQL) + Prometheus + Grafana
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. CloudPulse SaaS Web Application & REST API
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudpulse-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgres://cloudpulse_user:cloudpulse_pass@db:5432/cloudpulse_db
      - JWT_SECRET=devops_capstone_jwt_super_secret_key_2026_xyz987
      - METRICS_ENABLED=true
      - LOG_LEVEL=info
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cloudpulse-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Managed PostgreSQL 16 Database
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: cloudpulse-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cloudpulse_user
      POSTGRES_PASSWORD: cloudpulse_pass
      POSTGRES_DB: cloudpulse_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cloudpulse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudpulse_user -d cloudpulse_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. Prometheus Telemetry & Scraping Engine
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: cloudpulse-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - promdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - cloudpulse-network

  # ----------------------------------------------------------------------------
  # 4. Grafana Observability Dashboard
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: cloudpulse-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - cloudpulse-network

# ------------------------------------------------------------------------------
# Isolated Bridge Network & Persistent Volumes
# ------------------------------------------------------------------------------
networks:
  cloudpulse-network:
    driver: bridge

volumes:
  pgdata:
  promdata:
  grafanadata:
