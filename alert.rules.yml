# ==============================================================================
# CloudPulse - Prometheus Production Alert Rules
# ==============================================================================

groups:
  - name: cloudpulse_service_alerts
    rules:
      # Alert 1: Service Downtime
      - alert: CloudPulseServiceDown
        expr: up{job="cloudpulse-app"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "CloudPulse API instance is DOWN"
          description: "Container target {{ $labels.instance }} has been unreachable for more than 30 seconds."

      # Alert 2: High 5xx Error Rate (> 5%)
      - alert: HighHttpErrorRate
        expr: (sum(rate(http_errors_total[1m])) / sum(rate(http_requests_total[1m]))) * 100 > 5
        for: 1m
        labels:
          severity: high
        annotations:
          summary: "Elevated HTTP 5xx Error Rate detected"
          description: "HTTP error rate is currently {{ $value | printf \"%.2f\" }}% which exceeds the 5% SLO threshold."

      # Alert 3: High P95 Latency (> 500ms)
      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le)) > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "P95 Latency SLA Breached (> 500ms)"
          description: "95th percentile request latency has exceeded 500ms for over 1 minute."

      # Alert 4: Node.js Memory Exhaustion
      - alert: HighMemoryUsage
        expr: (nodejs_heap_size_used_bytes / nodejs_heap_size_total_bytes) * 100 > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Node.js Heap Memory near saturation"
          description: "Memory heap utilization is at {{ $value | printf \"%.2f\" }}%."
