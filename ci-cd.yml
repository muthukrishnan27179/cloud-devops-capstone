# ==============================================================================
# CloudPulse - End-to-End Enterprise CI/CD Pipeline
# Stages: Lint -> Test -> Security Scan -> Docker Build & Push -> Cloud Deploy
# ==============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Code Quality & Automated Tests
  # ----------------------------------------------------------------------------
  test:
    name: Lint & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Syntax & Lint Verification
        run: |
          echo "Verifying JavaScript syntax across all source files..."
          node -c server.js $(find src/ -name "*.js") $(find tests/ -name "*.js")

      - name: Execute Automated Test Suite (Jest)
        run: npm test -- --ci --coverage

  # ----------------------------------------------------------------------------
  # Stage 2: Security & Vulnerability Scan
  # ----------------------------------------------------------------------------
  security:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run NPM Security Audit
        run: npm audit --audit-level=critical || true

      - name: Run Trivy Vulnerability Scanner (Dockerfile)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-progress: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # ----------------------------------------------------------------------------
  # Stage 3: Container Build & Push to Registry
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Docker Build & Push (GHCR)
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Stage 4: Cloud Deployment Trigger
  # ----------------------------------------------------------------------------
  deploy:
    name: Continuous Deployment to Cloud
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Cloud Webhook Deployment (Render / Railway)
        run: |
          echo "Triggering automated cloud deployment webhook..."
          # If RENDER_DEPLOY_HOOK is set in GitHub Secrets, trigger live deployment
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "Cloud deployment triggered successfully!"
          else
            echo "No RENDER_DEPLOY_HOOK secret detected. Deployment can also be auto-triggered on Git push via Render/Railway Dashboard."
          fi
